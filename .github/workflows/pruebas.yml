# Corre las pruebas del repositorio, de la fábrica y del autolote en cada PR y en cada cambio a main.
name: Pruebas
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  repositorio:
    name: repositorio (estructura y secretos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  fabrica:
    name: fábrica (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: productos/fabrica-web-signature
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  # better-sqlite3 13 (base de datos local) pide Node 22 o superior.
  autolote:
    name: autolote (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: productos/autolote-ultra-premium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: productos/autolote-ultra-premium/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
